name: Import website release
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-site.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import release into repository
        run: |
          if [ ! -f site-release.zip ]; then exit 0; fi
          echo '271b052b6a993115bb1f57cf950d791445069b5e55447578f34a65841d8baa37  site-release.zip' | sha256sum --check
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('site-release.zip') as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Invalid archive path')
              archive.extractall('.')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html model-source.html *.css *.js README.md assets photos
          git rm site-release.zip
          git commit -m '发布卡通星球纪念日网站最新版'
          git push origin HEAD:main
