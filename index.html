<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们在一起</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #f6f1e8;
    --bg-2: #ece3d3;
    --bg-accent: rgba(196, 148, 82, 0.16);
    --ink: #2b2620;
    --ink-soft: rgba(43, 38, 32, 0.62);
    --ink-faint: rgba(43, 38, 32, 0.42);
    --accent: #b0762f;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow: 0 24px 60px rgba(80, 60, 30, 0.18), 0 4px 16px rgba(80, 60, 30, 0.08);
    --wall-opacity: 0.5;
    --overlay: linear-gradient(180deg, rgba(246,241,232,0.35), rgba(246,241,232,0.72));
  }
  html[data-theme="dark"] {
    --bg-1: #17140f;
    --bg-2: #221d16;
    --bg-accent: rgba(196, 148, 82, 0.12);
    --ink: #f0e9dd;
    --ink-soft: rgba(240, 233, 221, 0.62);
    --ink-faint: rgba(240, 233, 221, 0.4);
    --accent: #d9a55b;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    --glass-border: rgba(255,255,255,0.22);
    --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 4px 16px rgba(0, 0, 0, 0.3);
    --overlay: linear-gradient(180deg, rgba(23,20,15,0.4), rgba(23,20,15,0.78));
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Serif SC", "Songti SC", serif;
    color: var(--ink);
    background: var(--bg-1);
    overflow: hidden;
    transition: background 0.6s ease;
  }

  /* ---------- 兜底渐变背景（无照片时） ---------- */
  .fallback-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 800px at 18% 12%, var(--bg-accent), transparent 60%),
      radial-gradient(1000px 700px at 85% 88%, var(--bg-accent), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    transition: opacity 0.8s ease;
  }
  .fallback-bg.hidden { opacity: 0; }

  /* ---------- 照片墙 ---------- */
  .wall-depth {
    position: fixed; inset: 0; z-index: 0;
    will-change: transform;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .photo-wall {
    position: absolute; inset: -6%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 1fr;
    gap: 14px;
    opacity: var(--wall-opacity);
    filter: saturate(0.9);
    transition: opacity 0.5s ease;
  }
  .photo-wall.drift { animation: wallDrift 60s ease-in-out infinite alternate; }
  @keyframes wallDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-2.5%, -3%) scale(1.04); }
  }
  .tile {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.94);
    animation: tileIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards,
               tileFloat 7s ease-in-out infinite;
    cursor: zoom-in;
  }
  @keyframes tileIn {
    to { opacity: 1; }
  }
  @keyframes tileFloat {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.015) translateY(-9px); }
  }
  .tile img { transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .tile:hover img { transform: scale(1.06); }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 墙面之上的柔光罩，保证主体可读 */
  .wall-veil {
    position: fixed; inset: 0; z-index: 1;
    background: var(--overlay);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    pointer-events: none;
    transition: background 0.6s ease;
  }

  /* ---------- 漂浮光斑粒子 ---------- */
  .particles {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    bottom: -8vh;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 178, 106, 0.55), rgba(224, 178, 106, 0));
    filter: blur(6px);
    opacity: 0;
    animation: particleRise linear infinite;
  }
  html[data-theme="dark"] .particle {
    background: radial-gradient(circle, rgba(217, 165, 91, 0.4), rgba(217, 165, 91, 0));
  }
  @keyframes particleRise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    12%  { opacity: 1; }
    85%  { opacity: 0.9; }
    100% { transform: translate(var(--sway, 4vw), -118vh) scale(1.15); opacity: 0; }
  }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card-depth {
    will-change: transform;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    max-width: 92vw;
  }

  .glass-card {
    position: relative;
    text-align: center;
    padding: clamp(48px, 7vw, 84px) clamp(40px, 8vw, 110px);
    border-radius: 32px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow),
                inset 0 1px 0 rgba(255,255,255,0.5),
                inset 0 -1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    overflow: hidden;
    animation: cardIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.965); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* 入场编排：卡片内元素依次浮现 */
  .rise {
    opacity: 0;
    transform: translateY(16px);
    animation: riseIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* 液态高光：缓慢游走的折射光斑 */
  .glass-card::before {
    content: "";
    position: absolute; inset: -60%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(255,255,255,0.22) 40deg, transparent 90deg,
      transparent 180deg, rgba(255,255,255,0.14) 230deg, transparent 280deg);
    animation: liquidSheen 14s linear infinite;
    pointer-events: none;
  }
  @keyframes liquidSheen {
    to { transform: rotate(360deg); }
  }

  .eyebrow {
    font-size: clamp(14px, 1.4vw, 17px);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--ink-faint);
    margin-bottom: clamp(18px, 2.5vw, 28px);
  }

  h1.title {
    font-weight: 600;
    font-size: clamp(26px, 3.2vw, 40px);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: var(--ink-soft);
    margin-bottom: clamp(10px, 1.5vw, 18px);
    text-wrap: pretty;
  }

  .day-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(10px, 1.5vw, 18px);
  }
  .day-label {
    font-size: clamp(22px, 2.6vw, 34px);
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }
  .day-number {
    font-family: "DM Serif Display", "Noto Serif SC", serif;
    font-size: clamp(96px, 16vw, 200px);
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 20px rgba(176, 118, 47, 0.25);
    transform-origin: center 70%;
    animation: heartbeat 3.4s ease-in-out 1.8s infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    8%       { transform: scale(1.035); }
    16%      { transform: scale(1); }
    24%      { transform: scale(1.02); }
    34%      { transform: scale(1); }
  }
  .day-unit {
    font-size: clamp(22px, 2.6vw, 34px);
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  .meta {
    margin-top: clamp(20px, 3vw, 32px);
    font-size: clamp(14px, 1.5vw, 17px);
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .meta .divider {
    width: 56px; height: 1px;
    background: var(--ink-faint);
    margin: 6px auto 2px;
    opacity: 0.6;
  }
  .meta .milestone { color: var(--ink-faint); font-size: clamp(12px, 1.3vw, 14px); }

  /* ---------- 名字落款 ---------- */
  .names {
    margin-top: clamp(26px, 3.5vw, 40px);
    font-size: clamp(17px, 2vw, 22px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-soft);
  }
  .names .amp {
    font-family: "DM Serif Display", serif;
    font-style: italic;
    color: var(--accent);
    margin: 0 0.35em;
    font-size: 1.15em;
  }

  /* ---------- 照片放大查看 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 12, 8, 0.55);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
    cursor: zoom-out;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 88vw; max-height: 86vh;
    border-radius: 20px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    transform: scale(0.92);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lightbox.open img { transform: scale(1); }

  /* ---------- 宁静模式（Tweaks 一键关闭动感） ---------- */
  body.calm .particle { display: none; }
  body.calm .photo-wall,
  body.calm .tile,
  body.calm .tile img,
  body.calm .day-number,
  body.calm .glass-card::before {
    animation-play-state: paused !important;
    transition: none !important;
  }
  body.calm .wall-depth,
  body.calm .card-depth { transform: none !important; }

  /* ---------- Tweaks ---------- */
  .tweaks-toggle {
    position: fixed; right: 20px; bottom: 20px; z-index: 10;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: 0 8px 24px rgba(80, 60, 30, 0.15);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tweaks-toggle:hover { transform: rotate(40deg); }
  .tweaks-toggle svg { width: 20px; height: 20px; stroke: var(--ink-soft); }

  .tweaks-panel {
    position: fixed; right: 20px; bottom: 76px; z-index: 10;
    width: 240px;
    padding: 18px 20px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    box-shadow: var(--glass-shadow);
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .tweaks-panel.open { display: flex; animation: cardIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .tweaks-panel h3 {
    font-size: 13px; letter-spacing: 0.3em; color: var(--ink-faint); font-weight: 400;
  }
  .tweak-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; color: var(--ink-soft); letter-spacing: 0.06em;
  }
  .switch {
    position: relative; width: 40px; height: 22px;
    border-radius: 999px; border: 1px solid var(--glass-border);
    background: rgba(127, 110, 85, 0.2);
    cursor: pointer; transition: background 0.25s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }
  input[type="range"] {
    width: 110px; accent-color: var(--accent); cursor: pointer;
  }

  @media (max-width: 720px) {
    .photo-wall { grid-template-columns: repeat(3, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .photo-wall.drift, .glass-card::before, .tile, .day-number, .rise { animation: none; }
    .tile, .rise { opacity: 1; transform: none; }
    .particle { display: none; }
  }
</style>
</head>
<body>

  <div class="fallback-bg" id="fallbackBg"></div>
  <div class="wall-depth" id="wallDepth">
    <div class="photo-wall drift" id="photoWall"></div>
  </div>
  <div class="wall-veil"></div>
  <div class="particles" id="particles"></div>

  <main class="stage">
    <div class="card-depth" id="cardDepth">
      <section class="glass-card">
        <p class="eyebrow rise" style="animation-delay: 0.25s">SINCE 2024.11.17</p>
        <h1 class="title rise" style="animation-delay: 0.4s">我们在一起</h1>
        <div class="day-line rise" style="animation-delay: 0.55s">
          <span class="day-label">第</span>
          <span class="day-number" id="dayNumber">1</span>
          <span class="day-unit">天</span>
        </div>
        <div class="meta rise" style="animation-delay: 0.75s">
          <span id="weeksLine"></span>
        </div>
        <div class="names rise" style="animation-delay: 0.9s">
          陈煊鹏<span class="amp">&amp;</span>陈晓辉
        </div>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="照片放大查看"></div>

  <button class="tweaks-toggle" id="tweaksToggle" aria-label="Tweaks">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="tweaks-panel" id="tweaksPanel">
    <h3>TWEAKS</h3>
    <div class="tweak-row"><span>深色模式</span><div class="switch" id="themeSwitch"></div></div>
    <div class="tweak-row"><span>动感效果</span><div class="switch on" id="motionSwitch"></div></div>
    <div class="tweak-row"><span>照片墙漂移</span><div class="switch on" id="driftSwitch"></div></div>
    <div class="tweak-row"><span>照片墙浓度</span><input type="range" id="wallOpacity" min="20" max="90" value="50"></div>
  </div>

<script src="photos.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 天数计算：2024-11-17 为第 1 天 ---------- */
  var START = new Date(2024, 10, 17); // 月份从 0 起，10 = 11 月
  function todayMidnight() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  var DAY_MS = 86400000;
  var days = Math.floor((todayMidnight() - START) / DAY_MS) + 1;
  if (days < 1) days = 1;

  var weeks = Math.floor((days - 1) / 7);
  var restDays = (days - 1) % 7;
  document.getElementById("weeksLine").textContent =
    "始于 2024 年 11 月 17 日 · 已走过 " + weeks + " 周零 " + restDays + " 天";

  /* ---------- 大数字滚动入场 ---------- */
  var numEl = document.getElementById("dayNumber");
  var t0 = null, DURATION = 1600;
  function easeOut(x) { return 1 - Math.pow(1 - x, 4); }
  function tick(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DURATION, 1);
    numEl.textContent = Math.max(1, Math.round(easeOut(p) * days));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- 照片墙渲染（仅读取 photos 文件夹清单） ---------- */
  var wall = document.getElementById("photoWall");
  var fallbackBg = document.getElementById("fallbackBg");
  var TILE_TARGET = 18;

  function renderWall(items) {
    wall.innerHTML = "";

    if (!items.length) {
      fallbackBg.classList.remove("hidden");
      return;
    }
    fallbackBg.classList.add("hidden");

    // 照片不足一墙时循环铺满
    var tiles = [];
    for (var i = 0; i < Math.max(TILE_TARGET, items.length); i++) {
      tiles.push(items[i % items.length]);
    }

    tiles.forEach(function (item, idx) {
      var tile = document.createElement("div");
      tile.className = "tile";
      // 双动画分别设时长与延迟：入场依次浮现，漂浮相位随机错开
      tile.style.animationDuration = "0.9s, " + (6 + Math.random() * 5).toFixed(1) + "s";
      tile.style.animationDelay = (idx * 0.04).toFixed(2) + "s, " + (-Math.random() * 8).toFixed(1) + "s";
      var img = document.createElement("img");
      img.src = item.url;
      img.alt = "照片墙照片";
      tile.addEventListener("click", function () {
        openLightbox(item.url);
      });
      tile.appendChild(img);
      wall.appendChild(tile);
    });
  }

  function reload() {
    var items = (window.WALL_PHOTOS || []).map(function (p) {
      return { url: p };
    });
    renderWall(items);
  }

  /* ---------- 照片放大查看 ---------- */
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  function openLightbox(url) {
    lightboxImg.src = url;
    lightbox.classList.add("open");
  }
  lightbox.addEventListener("click", function () {
    lightbox.classList.remove("open");
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") lightbox.classList.remove("open");
  });

  /* ---------- 鼠标视差：照片墙与玻璃卡反向微移 ---------- */
  var wallDepth = document.getElementById("wallDepth");
  var cardDepth = document.getElementById("cardDepth");
  var px = 0, py = 0, rafId = null;
  function applyParallax() {
    rafId = null;
    wallDepth.style.transform = "translate3d(" + (px * -20) + "px," + (py * -14) + "px,0)";
    cardDepth.style.transform = "translate3d(" + (px * 9) + "px," + (py * 7) + "px,0)";
  }
  document.addEventListener("mousemove", function (e) {
    if (document.body.classList.contains("calm")) return;
    px = (e.clientX / window.innerWidth - 0.5) * 2;
    py = (e.clientY / window.innerHeight - 0.5) * 2;
    if (!rafId) rafId = requestAnimationFrame(applyParallax);
  });

  /* ---------- 漂浮光斑粒子 ---------- */
  var particlesBox = document.getElementById("particles");
  var PARTICLE_COUNT = 14;
  for (var pi = 0; pi < PARTICLE_COUNT; pi++) {
    var p = document.createElement("div");
    p.className = "particle";
    var size = 22 + Math.random() * 70;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = (Math.random() * 100) + "vw";
    p.style.setProperty("--sway", ((Math.random() - 0.5) * 14).toFixed(1) + "vw");
    p.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + "s";
    p.style.animationDelay = (-Math.random() * 26).toFixed(1) + "s";
    particlesBox.appendChild(p);
  }

  /* ---------- Tweaks ---------- */
  var panel = document.getElementById("tweaksPanel");
  document.getElementById("tweaksToggle").addEventListener("click", function () {
    panel.classList.toggle("open");
  });

  var themeSwitch = document.getElementById("themeSwitch");
  themeSwitch.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    if (dark) {
      document.documentElement.removeAttribute("data-theme");
      themeSwitch.classList.remove("on");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      themeSwitch.classList.add("on");
    }
  });

  var motionSwitch = document.getElementById("motionSwitch");
  motionSwitch.addEventListener("click", function () {
    motionSwitch.classList.toggle("on");
    document.body.classList.toggle("calm", !motionSwitch.classList.contains("on"));
    if (document.body.classList.contains("calm")) {
      wallDepth.style.transform = "";
      cardDepth.style.transform = "";
    }
  });

  var driftSwitch = document.getElementById("driftSwitch");
  driftSwitch.addEventListener("click", function () {
    driftSwitch.classList.toggle("on");
    wall.classList.toggle("drift", driftSwitch.classList.contains("on"));
  });

  document.getElementById("wallOpacity").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--wall-opacity", e.target.value / 100);
  });

  /* ---------- 启动 ---------- */
  reload();
})();
</script>
</body>
</html>
