<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#91b8db">
  <meta name="description" content="记录我们从 2024 年 11 月 17 日开始的每一天。">
  <title>我们的每一天</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23fff' d='M32 54S8 40 8 21c0-12 15-16 24-5 9-11 24-7 24 5 0 19-24 33-24 33Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="grain"></div>
  </div>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="glass hero-card float-layer" data-depth="10">
        <div class="eyebrow">
          <span class="light-dot"></span>
          <span id="periodLabel">此刻的我们</span>
        </div>

        <div class="counter-wrap">
          <p class="overline">在一起</p>
          <h1 id="hero-title"><span id="dayCount" aria-live="polite">—</span><span class="unit">天</span></h1>
          <p class="names">陈晓辉 <span aria-hidden="true">♡</span> 陈煊鹏</p>
          <p class="date-line">始于 2024.11.17</p>
        </div>

        <div class="today-row">
          <div>
            <span class="meta-label">今天</span>
            <strong id="todayDate">—</strong>
          </div>
          <div class="time-block">
            <span class="meta-label">此时此刻</span>
            <strong id="localTime">—</strong>
          </div>
        </div>
      </div>

      <button class="scroll-cue" id="scrollToMemories" type="button" aria-label="前往照片墙">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </section>

    <section class="memories" aria-labelledby="memories-title">
      <header class="section-head">
        <p class="overline">Moments</p>
        <h2 id="memories-title">一起走过的光景</h2>
        <p>每一次按下快门，时间就替我们多保存了一刻。</p>
      </header>

      <div class="photo-grid" id="photoGrid"></div>
    </section>

    <footer>
      <span>2024.11.17 — Forever</span>
      <span aria-hidden="true">♡</span>
    </footer>
  </main>

  <aside class="color-control is-minimized" aria-label="页面日光颜色控制">
    <div class="color-control-head">
      <span class="color-control-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        <span>日光</span>
      </span>
      <output id="colorTimeLabel" for="colorTime">—</output>
      <button class="color-control-toggle" id="colorControlToggle" type="button" aria-label="展开日光调节" aria-expanded="false" title="展开日光调节">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 14 4-4 4 4"/></svg>
      </button>
    </div>
    <div class="color-control-body">
      <input id="colorTime" type="range" min="0" max="1439" step="1" aria-label="调节页面日光颜色">
      <button id="resetColorTime" type="button">重置至北京时间</button>
    </div>
  </aside>

  <dialog class="lightbox" id="lightbox" aria-label="照片预览">
    <button class="close-button" type="button" aria-label="关闭照片预览">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
    <button class="nav-button prev" type="button" aria-label="上一张照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <figure><img id="lightboxImage" src="" alt="放大的回忆照片"><figcaption id="imagePosition"></figcaption></figure>
    <button class="nav-button next" type="button" aria-label="下一张照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </dialog>

  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
