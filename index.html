<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们在一起</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #f5ecc9;
    --bg-2: #faf2dc;
    --bg-3: #fdf7e9;
    --bg-accent: rgba(230, 205, 150, 0.16);
    --ink: #4a4436;
    --ink-soft: rgba(74, 68, 54, 0.62);
    --ink-faint: rgba(74, 68, 54, 0.42);
    --accent: #c9a85c;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18));
    --glass-border: rgba(255,255,255,0.68);
    --glass-shadow: 0 28px 70px rgba(90, 80, 60, 0.16), 0 6px 20px rgba(90, 80, 60, 0.08);
    --wall-opacity: 0.5;
  }
  html[data-theme="dark"] {
    --bg-1: #6a6694;
    --bg-2: #7d79a8;
    --bg-3: #908cbb;
    --bg-accent: rgba(200, 195, 235, 0.12);
    --ink: #f0eef9;
    --ink-soft: rgba(240, 238, 249, 0.62);
    --ink-faint: rgba(240, 238, 249, 0.4);
    --accent: #d9d4f0;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.09));
    --glass-border: rgba(255,255,255,0.26);
    --glass-shadow: 0 28px 70px rgba(40, 36, 70, 0.4), 0 6px 20px rgba(40, 36, 70, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Serif SC", "Songti SC", serif;
    color: var(--ink);
    background: var(--bg-1);
    overflow: hidden;
    transition: background 0.6s ease;
  }

  /* ---------- 兜底渐变背景（无照片时）：三段式天空渐变 ---------- */
  .fallback-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 800px at 18% 12%, var(--bg-accent), transparent 60%),
      radial-gradient(1000px 700px at 85% 88%, var(--bg-accent), transparent 55%),
      linear-gradient(165deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
    transition: opacity 0.8s ease;
  }
  .fallback-bg.hidden { opacity: 0; }

  /* ---------- 照片墙 ---------- */
  .wall-depth {
    position: fixed; inset: 0; z-index: 0;
    will-change: transform;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .photo-wall {
    position: absolute; inset: -6%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 1fr;
    gap: 14px;
    opacity: var(--wall-opacity);
    filter: saturate(0.9);
    transition: opacity 0.5s ease;
  }
  .photo-wall.drift { animation: wallDrift 60s ease-in-out infinite alternate; }
  @keyframes wallDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-2.5%, -3%) scale(1.04); }
  }
  .tile {
    position: relative;
    border-radius: 22px;
    corner-shape: squircle;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.94);
    animation: tileIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards,
               tileFloat 7s ease-in-out infinite;
    cursor: zoom-in;
  }
  @keyframes tileIn {
    to { opacity: 1; }
  }
  @keyframes tileFloat {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.015) translateY(-9px); }
  }
  .tile img { transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .tile:hover img { transform: scale(1.06); }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- 时段氛围特效层 ---------- */
  .effects {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  /* 清晨：飘动的雾气 */
  .fog {
    position: absolute; inset: -12%;
    background:
      radial-gradient(58% 38% at 28% 62%, rgba(255, 255, 255, 0.55), transparent 70%),
      radial-gradient(46% 32% at 68% 42%, rgba(255, 255, 255, 0.42), transparent 70%),
      radial-gradient(40% 30% at 50% 78%, rgba(255, 255, 255, 0.35), transparent 70%);
    filter: blur(34px);
    opacity: calc(var(--fog-o, 0) * 0.55);
    animation: fogDrift 48s ease-in-out infinite alternate;
  }
  @keyframes fogDrift {
    from { transform: translateX(-4%) translateY(0); }
    to   { transform: translateX(4%) translateY(-2%); }
  }
  /* 正午：地面升起的热浪 */
  .heat {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 55% at 50% 108%, rgba(255, 250, 235, 0.7), transparent 62%),
      radial-gradient(70% 30% at 30% 104%, rgba(255, 246, 225, 0.4), transparent 60%),
      radial-gradient(70% 30% at 72% 104%, rgba(255, 246, 225, 0.4), transparent 60%);
    filter: blur(10px);
    animation: heatPulse 6s ease-in-out infinite;
  }
  @keyframes heatPulse {
    0%, 100% { opacity: calc(var(--heat-o, 0) * 0.3); transform: scaleY(1); }
    50%      { opacity: calc(var(--heat-o, 0) * 0.45); transform: scaleY(1.08); }
  }
  /* 傍晚：地平线涌上的晚霞 */
  .sunset-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(135% 80% at 50% 118%, rgba(246, 150, 108, 0.6), rgba(232, 118, 138, 0.22) 45%, transparent 72%),
      radial-gradient(90% 45% at 50% 112%, rgba(255, 196, 140, 0.35), transparent 65%);
    animation: sunsetBreath 9s ease-in-out infinite;
  }
  @keyframes sunsetBreath {
    0%, 100% { opacity: calc(var(--sunset-o, 0) * 0.8); }
    50%      { opacity: calc(var(--sunset-o, 0) * 1); }
  }
  /* 夜晚：星空 */
  .stars {
    position: absolute; inset: 0;
    opacity: var(--stars-o, 0);
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.85); }
    50%      { opacity: 0.95; transform: scale(1.15); }
  }

  /* ---------- 漂浮光斑粒子 ---------- */
  .particles {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    bottom: -8vh;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--particle-rgb, 224, 178, 106), 0.55), rgba(var(--particle-rgb, 224, 178, 106), 0));
    filter: blur(6px);
    opacity: 0;
    animation: particleRise linear infinite;
  }
  @keyframes particleRise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    12%  { opacity: 1; }
    85%  { opacity: 0.9; }
    100% { transform: translate(var(--sway, 4vw), -118vh) scale(1.15); opacity: 0; }
  }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative; z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card-depth {
    will-change: transform;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    max-width: 92vw;
  }

  .glass-card {
    position: relative;
    text-align: center;
    padding: clamp(48px, 7vw, 84px) clamp(40px, 8vw, 110px);
    /* 苹果式连续曲率圆角（squircle）：支持的浏览器呈现超椭圆角，其余退回普通圆角 */
    border-radius: 48px;
    corner-shape: squircle;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow),
                inset 0 1px 0 rgba(255,255,255,0.5),
                inset 0 -1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(40px) saturate(1.7) brightness(1.04);
    -webkit-backdrop-filter: blur(40px) saturate(1.7) brightness(1.04);
    overflow: hidden;
    animation: cardIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.965); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* 入场编排：卡片内元素依次浮现（带模糊聚焦） */
  .rise {
    opacity: 0;
    transform: translateY(16px);
    filter: blur(10px);
    animation: riseIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* 指针跟随的镜面高光 */
  .glass-gloss {
    position: absolute; inset: 0;
    background: radial-gradient(520px circle at var(--gx, 50%) var(--gy, 28%),
      rgba(255, 255, 255, 0.32), transparent 55%);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .glass-card:hover .glass-gloss { opacity: 1; }

  /* 液态高光：缓慢游走的折射光斑 */
  .glass-card::before {
    content: "";
    position: absolute; inset: -60%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(255,255,255,0.22) 40deg, transparent 90deg,
      transparent 180deg, rgba(255,255,255,0.14) 230deg, transparent 280deg);
    animation: liquidSheen 14s linear infinite;
    pointer-events: none;
  }
  @keyframes liquidSheen {
    to { transform: rotate(360deg); }
  }

  .eyebrow {
    font-size: clamp(14px, 1.4vw, 17px);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--ink-faint);
    margin-bottom: clamp(18px, 2.5vw, 28px);
  }

  h1.title {
    font-weight: 600;
    font-size: clamp(26px, 3.2vw, 40px);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: var(--ink-soft);
    margin-bottom: clamp(10px, 1.5vw, 18px);
    text-wrap: pretty;
  }

  .day-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(10px, 1.5vw, 18px);
  }
  .day-label {
    font-size: clamp(22px, 2.6vw, 34px);
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }
  .day-number {
    font-family: "DM Serif Display", "Noto Serif SC", serif;
    font-size: clamp(96px, 16vw, 200px);
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 20px rgba(var(--particle-rgb, 224, 178, 106), 0.28);
    transform-origin: center 70%;
    animation: heartbeat 3.4s ease-in-out 1.8s infinite;
  }
  /* 纪念日模式：更快的节奏 + 金色辉光 */
  .day-number.festival {
    animation-duration: 2.2s;
    text-shadow: 0 0 14px rgba(var(--particle-rgb, 224, 178, 106), 0.55),
                 0 0 46px rgba(var(--particle-rgb, 224, 178, 106), 0.4);
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    8%       { transform: scale(1.035); }
    16%      { transform: scale(1); }
    24%      { transform: scale(1.02); }
    34%      { transform: scale(1); }
  }
  .day-unit {
    font-size: clamp(22px, 2.6vw, 34px);
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  .meta {
    margin-top: clamp(20px, 3vw, 32px);
    font-size: clamp(14px, 1.5vw, 17px);
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .meta .divider {
    width: 56px; height: 1px;
    background: var(--ink-faint);
    margin: 6px auto 2px;
    opacity: 0.6;
  }
  .meta .milestone { color: var(--ink-faint); font-size: clamp(12px, 1.3vw, 14px); }

  /* 实时计时 */
  .live-timer {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    font-size: clamp(13px, 1.4vw, 16px);
    padding-top: 2px;
  }

  /* ---------- 名字落款 ---------- */
  .names {
    margin-top: clamp(26px, 3.5vw, 40px);
    font-size: clamp(17px, 2vw, 22px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-soft);
  }
  .names .amp {
    font-family: "DM Serif Display", serif;
    font-style: italic;
    color: var(--accent);
    margin: 0 0.35em;
    font-size: 1.15em;
  }

  /* ---------- 照片放大查看 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 12, 8, 0.55);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
    cursor: zoom-out;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 88vw; max-height: 86vh;
    border-radius: 28px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    transform: scale(0.92);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lightbox.open img { transform: scale(1); }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .lb-nav:hover { background: rgba(255, 255, 255, 0.24); }
  .lb-nav:active { transform: translateY(-50%) scale(0.92); }
  .lb-nav svg { width: 20px; height: 20px; stroke: rgba(255, 255, 255, 0.9); }
  .lb-nav.prev { left: clamp(12px, 3vw, 32px); }
  .lb-nav.next { right: clamp(12px, 3vw, 32px); }
  .lb-count {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px; letter-spacing: 0.3em; text-indent: 0.3em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 宁静模式（Tweaks 一键关闭动感） ---------- */
  body.calm .particle { display: none; }
  body.calm .photo-wall,
  body.calm .tile,
  body.calm .tile img,
  body.calm .day-number,
  body.calm .glass-card::before,
  body.calm .effects .fog,
  body.calm .effects .heat,
  body.calm .effects .sunset-glow,
  body.calm .effects .star {
    animation-play-state: paused !important;
    transition: none !important;
  }
  body.calm .wall-depth,
  body.calm .card-depth { transform: none !important; }

  /* ---------- Tweaks ---------- */
  .tweaks-toggle {
    position: fixed; right: 20px; bottom: 20px; z-index: 10;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: 0 8px 24px rgba(80, 60, 30, 0.15);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tweaks-toggle:hover { transform: rotate(40deg); }
  .tweaks-toggle svg { width: 20px; height: 20px; stroke: var(--ink-soft); }

  .tweaks-panel {
    position: fixed; right: 20px; bottom: 76px; z-index: 10;
    width: 240px;
    padding: 18px 20px;
    border-radius: 28px;
    corner-shape: squircle;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    box-shadow: var(--glass-shadow);
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .tweaks-panel.open { display: flex; animation: cardIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .tweaks-panel h3 {
    font-size: 13px; letter-spacing: 0.3em; color: var(--ink-faint); font-weight: 400;
  }
  .tweak-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; color: var(--ink-soft); letter-spacing: 0.06em;
  }
  .switch {
    position: relative; width: 40px; height: 22px;
    border-radius: 999px; border: 1px solid var(--glass-border);
    background: rgba(127, 110, 85, 0.2);
    cursor: pointer; transition: background 0.25s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }
  input[type="range"] {
    width: 110px; accent-color: var(--accent); cursor: pointer;
  }
  .mini-btn {
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
  }
  .mini-btn:hover { transform: translateY(-1px); color: var(--ink); }
  .mini-btn:active { transform: translateY(0) scale(0.95); }

  /* 时间滑杆行 */
  .time-row {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .time-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; color: var(--ink-soft); letter-spacing: 0.06em;
  }
  .time-head .mini-btn { font-size: 11px; padding: 4px 10px; }
  .time-row input[type="range"] { width: 100%; }
  .time-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .time-labels .cur { color: var(--accent); letter-spacing: 0.08em; }

  @media (max-width: 720px) {
    .photo-wall { grid-template-columns: repeat(3, 1fr); }
    .glass-card { border-radius: 36px; padding: 44px 30px; }
    .tweaks-panel { border-radius: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .photo-wall.drift, .glass-card::before, .tile, .day-number, .rise { animation: none; }
    .tile, .rise { opacity: 1; transform: none; filter: none; }
    .particle, .effects .star, .effects .fog, .effects .heat, .effects .sunset-glow { animation: none; }
  }
</style>
</head>
<body>

  <div class="fallback-bg" id="fallbackBg"></div>
  <div class="wall-depth" id="wallDepth">
    <div class="photo-wall drift" id="photoWall"></div>
  </div>
  <div class="effects">
    <div class="stars" id="stars"></div>
    <div class="fog"></div>
    <div class="heat"></div>
    <div class="sunset-glow"></div>
  </div>
  <div class="particles" id="particles"></div>

  <main class="stage">
    <div class="card-depth" id="cardDepth">
      <section class="glass-card">
        <div class="glass-gloss" id="glassGloss"></div>
        <p class="eyebrow rise" style="animation-delay: 0.25s">SINCE 2024.11.17</p>
        <h1 class="title rise" style="animation-delay: 0.4s">我们在一起</h1>
        <div class="day-line rise" style="animation-delay: 0.55s">
          <span class="day-label">第</span>
          <span class="day-number" id="dayNumber">1</span>
          <span class="day-unit">天</span>
        </div>
        <div class="meta rise" style="animation-delay: 0.75s">
          <span id="weeksLine"></span>
          <div class="live-timer" id="liveTimer"></div>
        </div>
        <div class="names rise" style="animation-delay: 0.9s">
          陈煊鹏<span class="amp">&amp;</span>陈晓辉
        </div>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" alt="照片放大查看">
    <button class="lb-nav prev" id="lbPrev" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="lb-nav next" id="lbNext" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <span class="lb-count" id="lbCount"></span>
  </div>

  <button class="tweaks-toggle" id="tweaksToggle" aria-label="Tweaks">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="tweaks-panel" id="tweaksPanel">
    <h3>TWEAKS</h3>
    <div class="tweak-row"><span>动感效果</span><div class="switch on" id="motionSwitch"></div></div>
    <div class="tweak-row"><span>照片墙漂移</span><div class="switch on" id="driftSwitch"></div></div>
    <div class="tweak-row"><span>照片墙浓度</span><input type="range" id="wallOpacity" min="20" max="90" value="50"></div>
    <div class="tweak-row time-row">
      <div class="time-head">
        <span>时间预览</span>
        <button class="mini-btn" id="beijingBtn">对齐北京时间</button>
      </div>
      <input type="range" id="timeSlider" min="0" max="1440" step="5" value="720">
      <div class="time-labels">
        <span>00:00</span>
        <span class="cur" id="timeLabel">北京时间</span>
        <span>24:00</span>
      </div>
    </div>
  </div>

<script src="photos.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- 天数计算：2024-11-17 为第 1 天 ---------- */
  var START = new Date(2024, 10, 17); // 月份从 0 起，10 = 11 月
  function todayMidnight() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  var DAY_MS = 86400000;
  var days = Math.floor((todayMidnight() - START) / DAY_MS) + 1;
  if (days < 1) days = 1;

  var weeks = Math.floor((days - 1) / 7);
  var restDays = (days - 1) % 7;
  var weeksText = "始于 2024 年 11 月 17 日 · 已走过 " + weeks + " 周零 " + restDays + " 天";

  /* ---------- 纪念日彩蛋：周年 / 整百天 ---------- */
  var special = null;
  var nowD = new Date();
  if (nowD.getMonth() === 10 && nowD.getDate() === 17) {
    special = { label: "今天是 " + (nowD.getFullYear() - 2024) + " 周年纪念日" };
  } else if (days % 100 === 0) {
    special = { label: "今天是整百的第 " + days + " 天" };
  }
  if (special) weeksText += " · " + special.label;
  document.getElementById("weeksLine").textContent = weeksText;
  if (special) document.getElementById("dayNumber").classList.add("festival");

  /* ---------- 实时计时：已相守 h 时 m 分 s 秒 ---------- */
  var liveTimer = document.getElementById("liveTimer");
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function updateTimer() {
    var e = Date.now() - START.getTime();
    if (e < 0) e = 0;
    var h = Math.floor(e / 3600000);
    var m = Math.floor(e / 60000) % 60;
    var s = Math.floor(e / 1000) % 60;
    liveTimer.textContent = "已相守 " + h + " 小时 " + pad(m) + " 分 " + pad(s) + " 秒";
  }
  updateTimer();
  setInterval(updateTimer, 1000);

  /* ---------- 大数字滚动入场 ---------- */
  var numEl = document.getElementById("dayNumber");
  var t0 = null, DURATION = 1600;
  function easeOut(x) { return 1 - Math.pow(1 - x, 4); }
  function tick(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DURATION, 1);
    numEl.textContent = Math.max(1, Math.round(easeOut(p) * days));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- 时段色彩系统：24 小时天空渐变（参考苹果天气） ----------
     关键帧之间线性插值，颜色随时间连续变化；凌晨/夜晚深色，白天浅色 */
  var KEYFRAMES = [
    { t: 0,    bg1: "#6a6694", bg2: "#7d79a8", bg3: "#908cbb", accent: "#d9d4f0", glow: [170,165,210], particle: [200,195,230] }, // 凌晨 香芋紫
    { t: 270,  bg1: "#8b87b0", bg2: "#9c98c0", bg3: "#aba7cc", accent: "#cfcbe8", glow: [185,180,215], particle: [212,207,235] }, // 黎明前 淡藕紫
    { t: 390,  bg1: "#f6d9cb", bg2: "#f9e4d8", bg3: "#fdefe4", accent: "#dd8f7e", glow: [238,178,158], particle: [248,205,185] }, // 日出 蜜桃粉
    { t: 540,  bg1: "#b6d5e8", bg2: "#cfe3f2", bg3: "#e4f0f8", accent: "#7aa8cc", glow: [155,192,220], particle: [192,216,238] }, // 早上 淡蓝
    { t: 630,  bg1: "#e7e9e2", bg2: "#edeee7", bg3: "#f2f3ec", accent: "#a8ab9d", glow: [205,207,195], particle: [227,229,217] }, // 上午 10:30 奶白过渡
    { t: 720,  bg1: "#f5ecc9", bg2: "#faf2dc", bg3: "#fdf7e9", accent: "#c9a85c", glow: [232,208,152], particle: [243,225,180] }, // 正午 柠檬奶黄
    { t: 900,  bg1: "#f6e7c8", bg2: "#faefd8", bg3: "#fdf6e7", accent: "#c9a05e", glow: [234,203,148], particle: [245,220,175] }, // 下午 杏子奶黄
    { t: 1050, bg1: "#f9d9cf", bg2: "#f7c5bd", bg3: "#f4b5b4", accent: "#df8a80", glow: [240,163,143], particle: [248,195,180] }, // 傍晚 西柚粉
    { t: 1150, bg1: "#c3b3d3", bg2: "#ac9cc0", bg3: "#9789b0", accent: "#8f7fae", glow: [186,168,205], particle: [218,205,235] }, // 暮色 玫瑰紫
    { t: 1320, bg1: "#6a6694", bg2: "#7d79a8", bg3: "#908cbb", accent: "#d9d4f0", glow: [170,165,210], particle: [200,195,230] }, // 夜晚 薰衣草
    { t: 1440, bg1: "#6a6694", bg2: "#7d79a8", bg3: "#908cbb", accent: "#d9d4f0", glow: [170,165,210], particle: [200,195,230] }  // 24:00
  ];

  function lerp(a, b, p) { return a + (b - a) * p; }
  function lerpHex(h1, h2, p) {
    var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    var r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, p));
    var g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, p));
    var bl = Math.round(lerp(a & 255, b & 255, p));
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  function lerp3(a, b, p) {
    return Math.round(lerp(a[0], b[0], p)) + "," + Math.round(lerp(a[1], b[1], p)) + "," + Math.round(lerp(a[2], b[2], p));
  }
  function lumaOfRgbStr(s) {
    var m = s.match(/\d+/g);
    return (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) / 255;
  }
  function paletteAt(min) {
    var i = 0;
    while (i < KEYFRAMES.length - 2 && KEYFRAMES[i + 1].t <= min) i++;
    var k0 = KEYFRAMES[i], k1 = KEYFRAMES[i + 1];
    var p = Math.min(1, Math.max(0, (min - k0.t) / (k1.t - k0.t)));
    return {
      bg1: lerpHex(k0.bg1, k1.bg1, p),
      bg2: lerpHex(k0.bg2, k1.bg2, p),
      bg3: lerpHex(k0.bg3, k1.bg3, p),
      accent: lerpHex(k0.accent, k1.accent, p),
      glow: lerp3(k0.glow, k1.glow, p),
      particle: lerp3(k0.particle, k1.particle, p)
    };
  }
  function beijingMinutes() {
    try {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Shanghai", hour: "numeric", minute: "numeric", hour12: false
      }).formatToParts(new Date());
      var h = 0, m = 0;
      parts.forEach(function (pt) {
        if (pt.type === "hour") h = parseInt(pt.value, 10) % 24;
        if (pt.type === "minute") m = parseInt(pt.value, 10);
      });
      return h * 60 + m;
    } catch (e) {
      var n = new Date();
      return n.getHours() * 60 + n.getMinutes();
    }
  }
  /* 氛围特效强度：钟形曲线（雾/热浪/晚霞）+ 平滑阶跃（星星） */
  function bell(t, center, sigma) { return Math.exp(-Math.pow((t - center) / sigma, 2)); }
  function smoothstep(e0, e1, x) {
    var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  var overrideMinutes = null;   // 滑杆手动预览（null = 跟随北京时间）
  var timeSlider = document.getElementById("timeSlider");
  var timeLabel = document.getElementById("timeLabel");

  function applyPalette() {
    var min = overrideMinutes !== null ? overrideMinutes : beijingMinutes();
    var pal = paletteAt(min);
    var dark = lumaOfRgbStr(pal.bg1) < 0.45;
    var root = document.documentElement;

    root.setAttribute("data-theme", dark ? "dark" : "light");
    root.style.setProperty("--bg-1", pal.bg1);
    root.style.setProperty("--bg-2", pal.bg2);
    root.style.setProperty("--bg-3", pal.bg3);
    root.style.setProperty("--bg-accent", "rgba(" + pal.glow + ", " + (dark ? 0.12 : 0.16) + ")");
    root.style.setProperty("--accent", pal.accent);
    root.style.setProperty("--particle-rgb", pal.particle);

    // 氛围强度
    root.style.setProperty("--fog-o",    bell(min, 390, 105).toFixed(3));   // 清晨雾气
    root.style.setProperty("--heat-o",   bell(min, 780, 125).toFixed(3));   // 正午热浪
    root.style.setProperty("--sunset-o", bell(min, 1080, 48).toFixed(3));   // 傍晚晚霞
    root.style.setProperty("--stars-o",
      Math.max(smoothstep(1120, 1180, min), 1 - smoothstep(290, 350, min)).toFixed(3)); // 夜晚星星

    // 标签与滑杆状态
    if (overrideMinutes !== null) {
      var hh = Math.floor(overrideMinutes / 60), mm = overrideMinutes % 60;
      timeLabel.textContent = (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
    } else {
      timeLabel.textContent = "北京时间";
      timeSlider.value = min;
    }
  }
  applyPalette();
  setInterval(applyPalette, 30000); // 定期校准

  timeSlider.addEventListener("input", function (e) {
    overrideMinutes = parseInt(e.target.value, 10);
    applyPalette();
  });
  document.getElementById("beijingBtn").addEventListener("click", function () {
    overrideMinutes = null;
    applyPalette();
  });

  /* ---------- 夜晚星空 ---------- */
  var starsBox = document.getElementById("stars");
  for (var si = 0; si < 70; si++) {
    var star = document.createElement("div");
    star.className = "star";
    var ss = 1 + Math.random() * 1.8;
    star.style.width = ss + "px";
    star.style.height = ss + "px";
    star.style.left = (Math.random() * 100) + "vw";
    star.style.top = (Math.random() * 100) + "vh";
    star.style.animationDuration = (2 + Math.random() * 4).toFixed(1) + "s";
    star.style.animationDelay = (-Math.random() * 5).toFixed(1) + "s";
    starsBox.appendChild(star);
  }

  /* ---------- 照片墙渲染（仅读取 photos 文件夹清单） ---------- */
  var wall = document.getElementById("photoWall");
  var fallbackBg = document.getElementById("fallbackBg");
  var TILE_TARGET = 18;
  var photoItems = [];

  function renderWall(items) {
    wall.innerHTML = "";
    photoItems = items;

    if (!items.length) {
      fallbackBg.classList.remove("hidden");
      return;
    }
    fallbackBg.classList.add("hidden");

    // 照片不足一墙时循环铺满
    var tiles = [];
    for (var i = 0; i < Math.max(TILE_TARGET, items.length); i++) {
      tiles.push(items[i % items.length]);
    }

    tiles.forEach(function (item, idx) {
      var tile = document.createElement("div");
      tile.className = "tile";
      // 双动画分别设时长与延迟：入场依次浮现，漂浮相位随机错开
      tile.style.animationDuration = "0.9s, " + (6 + Math.random() * 5).toFixed(1) + "s";
      tile.style.animationDelay = (idx * 0.04).toFixed(2) + "s, " + (-Math.random() * 8).toFixed(1) + "s";
      var img = document.createElement("img");
      img.src = item.url;
      img.alt = "照片墙照片";
      tile.addEventListener("click", function () {
        openLightbox(item.url);
      });
      tile.appendChild(img);
      wall.appendChild(tile);
    });
  }

  function reload() {
    var items = (window.WALL_PHOTOS || []).map(function (p) {
      return { url: p };
    });
    renderWall(items);
  }

  /* ---------- 照片放大查看（支持翻页） ---------- */
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lbCount = document.getElementById("lbCount");
  var lbPrev = document.getElementById("lbPrev");
  var lbNext = document.getElementById("lbNext");
  var lbIndex = 0;

  function showPhoto(idx) {
    var total = photoItems.length;
    if (!total) return;
    lbIndex = ((idx % total) + total) % total;
    lightboxImg.src = photoItems[lbIndex].url;
    lbCount.textContent = (lbIndex + 1) + " / " + total;
  }
  function openLightbox(url) {
    var idx = 0;
    for (var i = 0; i < photoItems.length; i++) {
      if (photoItems[i].url === url) { idx = i; break; }
    }
    showPhoto(idx);
    lightbox.classList.add("open");
  }
  function closeLightbox() { lightbox.classList.remove("open"); }
  lightbox.addEventListener("click", closeLightbox);
  lbPrev.addEventListener("click", function (e) { e.stopPropagation(); showPhoto(lbIndex - 1); });
  lbNext.addEventListener("click", function (e) { e.stopPropagation(); showPhoto(lbIndex + 1); });
  document.addEventListener("keydown", function (e) {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") showPhoto(lbIndex - 1);
    if (e.key === "ArrowRight") showPhoto(lbIndex + 1);
  });

  /* ---------- 鼠标视差：照片墙与玻璃卡反向微移 ---------- */
  var wallDepth = document.getElementById("wallDepth");
  var cardDepth = document.getElementById("cardDepth");
  var px = 0, py = 0, rafId = null;
  function applyParallax() {
    rafId = null;
    wallDepth.style.transform = "translate3d(" + (px * -20) + "px," + (py * -14) + "px,0)";
    cardDepth.style.transform = "translate3d(" + (px * 9) + "px," + (py * 7) + "px,0)";
  }
  document.addEventListener("mousemove", function (e) {
    if (document.body.classList.contains("calm")) return;
    px = (e.clientX / window.innerWidth - 0.5) * 2;
    py = (e.clientY / window.innerHeight - 0.5) * 2;
    if (!rafId) rafId = requestAnimationFrame(applyParallax);
  });

  /* ---------- 玻璃卡指针高光跟随 ---------- */
  var glassCard = document.querySelector(".glass-card");
  glassCard.addEventListener("mousemove", function (e) {
    var r = glassCard.getBoundingClientRect();
    glassCard.style.setProperty("--gx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
    glassCard.style.setProperty("--gy", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
  });

  /* ---------- 漂浮光斑粒子（纪念日加密一倍） ---------- */
  var particlesBox = document.getElementById("particles");
  var PARTICLE_COUNT = special ? 28 : 14;
  for (var pi = 0; pi < PARTICLE_COUNT; pi++) {
    var p = document.createElement("div");
    p.className = "particle";
    var size = 22 + Math.random() * 70;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = (Math.random() * 100) + "vw";
    p.style.setProperty("--sway", ((Math.random() - 0.5) * 14).toFixed(1) + "vw");
    p.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + "s";
    p.style.animationDelay = (-Math.random() * 26).toFixed(1) + "s";
    particlesBox.appendChild(p);
  }

  /* ---------- Tweaks ---------- */
  var panel = document.getElementById("tweaksPanel");
  document.getElementById("tweaksToggle").addEventListener("click", function () {
    panel.classList.toggle("open");
  });

  var motionSwitch = document.getElementById("motionSwitch");
  motionSwitch.addEventListener("click", function () {
    motionSwitch.classList.toggle("on");
    document.body.classList.toggle("calm", !motionSwitch.classList.contains("on"));
    if (document.body.classList.contains("calm")) {
      wallDepth.style.transform = "";
      cardDepth.style.transform = "";
    }
  });

  var driftSwitch = document.getElementById("driftSwitch");
  driftSwitch.addEventListener("click", function () {
    driftSwitch.classList.toggle("on");
    wall.classList.toggle("drift", driftSwitch.classList.contains("on"));
  });

  document.getElementById("wallOpacity").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--wall-opacity", e.target.value / 100);
  });

  /* ---------- 启动 ---------- */
  reload();
})();
</script>
</body>
</html>
